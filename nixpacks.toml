# Nixpacks configuration for Railway deployment
# Overrides the default Laravel build to skip view:cache, which requires
# a database connection that is not available during the build phase.

[phases.setup]
nixPkgs = ["php83", "php83Extensions.pdo", "php83Extensions.pdo_mysql", "php83Extensions.mbstring", "php83Extensions.tokenizer", "php83Extensions.xml", "php83Extensions.ctype", "php83Extensions.fileinfo", "php83Extensions.curl", "php83Extensions.zip", "php83Extensions.bcmath", "nodejs_20", "nodePackages.npm"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist",
  "npm ci",
  "npm run build"
]

[phases.build]
cmds = [
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan event:cache"
]

[start]
cmd = "php artisan migrate --force && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=${PORT:-8000}"
